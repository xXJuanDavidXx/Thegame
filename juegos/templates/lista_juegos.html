{% extends 'base.html' %}%



{% block content %}
<h1>Lista de Juegos</h1>
<ul>
    {% for juego in juegos %}
        <li>
            <a href="{% url 'ejecutar_juego' juego.id %}">{{ juego.nombre }}</a>
            - Subido por: {{ juego.usuario.username }}
            {% if juego.imagen %}
                <img src="{{ juego.imagen.url }}" alt="{{ juego.nombre }}" style="max-width: 100px;">
            {% endif %}
        </li>
    {% endfor %}
</ul>
{% endblock %}
